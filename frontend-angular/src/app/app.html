<header class="app-header" *ngIf="autenticado">
    <div class="logo">🚚 ExpresoFast</div>

    <nav class="main-nav">
        <a routerLink="/envios" routerLinkActive="activo">Envios</a>
        <a routerLink="/nuevo-envio" routerLinkActive="activo">Nuevo Envio</a>
        <a routerLink="/rastreo" routerLinkActive="activo">Rastrear Guia</a>
        <a routerLink="/nuevo-envio-avanzado" routerLinkActive="activo">Envio con Paquetes</a>
    </nav>

    <div class="usuario-info">
        <span>{{ username }}</span>
        <button (click)="cerrarSesion()">Cerrar Sesion</button>
    </div>
</header>

<main>
    <router-outlet></router-outlet>
</main>
